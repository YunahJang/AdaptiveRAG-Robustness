<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="rag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="559" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- column headers -->
  <text x="40" y="52" font-size="13" font-weight="700" letter-spacing="1.5" fill="#64748b">ONE INFORMATION NEED · EIGHT SURFACE FORMS</text>
  <text x="694" y="52" font-size="13" font-weight="700" letter-spacing="1.5" fill="#64748b">SYSTEM</text>
  <text x="936" y="52" font-size="13" font-weight="700" letter-spacing="1.5" fill="#64748b">THREE ROBUSTNESS AXES</text>

  <!-- query pills -->
  <g font-size="14">
    <!-- Original -->
    <rect x="40" y="76" width="580" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="40" y="76" width="118" height="44" rx="10" fill="#334155"/>
    <rect x="148" y="76" width="10" height="44" fill="#334155"/>
    <text x="99" y="103" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12.5">Original</text>
    <text x="174" y="103" fill="#0f172a">who wrote the declaration of independence</text>

    <!-- Human -->
    <rect x="40" y="128" width="580" height="44" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
    <rect x="40" y="128" width="118" height="44" rx="10" fill="#7c3aed"/>
    <rect x="148" y="128" width="10" height="44" fill="#7c3aed"/>
    <text x="99" y="155" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12.5">Human</text>
    <text x="174" y="155" fill="#0f172a">Can you tell me who authored the Declaration of Independence?</text>

    <!-- Formality -->
    <rect x="40" y="180" width="580" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="40" y="180" width="118" height="44" rx="10" fill="#2563eb"/>
    <rect x="148" y="180" width="10" height="44" fill="#2563eb"/>
    <text x="99" y="207" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12.5">Formality</text>
    <text x="174" y="207" fill="#0f172a">hey, so who actually wrote the declaration of independence?</text>

    <!-- Readability -->
    <rect x="40" y="232" width="580" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="40" y="232" width="118" height="44" rx="10" fill="#2563eb"/>
    <rect x="148" y="232" width="10" height="44" fill="#2563eb"/>
    <text x="99" y="259" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12.5">Readability</text>
    <text x="174" y="259" fill="#0f172a">To which individual is the authorship of the Declaration ascribed?</text>

    <!-- Declarative -->
    <rect x="40" y="284" width="580" height="44" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="40" y="284" width="118" height="44" rx="10" fill="#0d9488"/>
    <rect x="148" y="284" width="10" height="44" fill="#0d9488"/>
    <text x="99" y="311" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12.5">Declarative</text>
    <text x="174" y="311" fill="#0f172a">I want to know who wrote the Declaration of Independence.</text>

    <!-- Imperative -->
    <rect x="40" y="336" width="580" height="44" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="40" y="336" width="118" height="44" rx="10" fill="#0d9488"/>
    <rect x="148" y="336" width="10" height="44" fill="#0d9488"/>
    <text x="99" y="363" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12.5">Imperative</text>
    <text x="174" y="363" fill="#0f172a">Tell me who wrote the Declaration of Independence.</text>

    <!-- Spelling -->
    <rect x="40" y="388" width="580" height="44" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="40" y="388" width="118" height="44" rx="10" fill="#ea580c"/>
    <rect x="148" y="388" width="10" height="44" fill="#ea580c"/>
    <text x="99" y="415" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12.5">Spelling</text>
    <text x="174" y="415" fill="#0f172a">who wrote the declaraton of independance</text>

    <!-- Grammar -->
    <rect x="40" y="440" width="580" height="44" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="40" y="440" width="118" height="44" rx="10" fill="#ea580c"/>
    <rect x="148" y="440" width="10" height="44" fill="#ea580c"/>
    <text x="99" y="467" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="12.5">Grammar</text>
    <text x="174" y="467" fill="#0f172a">who did wrote the declaration of independence</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#475569">
    <circle cx="48" cy="510" r="5" fill="#7c3aed"/><text x="59" y="514">Human rewrite</text>
    <circle cx="170" cy="510" r="5" fill="#2563eb"/><text x="181" y="514">Style</text>
    <circle cx="236" cy="510" r="5" fill="#0d9488"/><text x="247" y="514">Sentence type</text>
    <circle cx="352" cy="510" r="5" fill="#ea580c"/><text x="363" y="514">Error</text>
    <text x="40" y="542" font-style="italic" fill="#94a3b8">Illustrative example. The gold answer is identical for every form, so any change in output comes from the surface form alone.</text>
  </g>

  <!-- fan-in connectors -->
  <g fill="none" stroke="#cbd5e1" stroke-width="1.5">
    <path d="M620,98 C660,98 650,280 690,280"/>
    <path d="M620,150 C660,150 650,280 690,280"/>
    <path d="M620,202 C660,202 650,280 690,280"/>
    <path d="M620,254 C660,254 650,280 690,280"/>
    <path d="M620,306 C660,306 650,280 690,280"/>
    <path d="M620,358 C660,358 650,280 690,280"/>
    <path d="M620,410 C660,410 650,280 690,280"/>
    <path d="M620,462 C660,462 650,280 690,280"/>
  </g>

  <!-- Adaptive RAG box -->
  <rect x="690" y="160" width="200" height="240" rx="16" fill="url(#rag)"/>
  <text x="790" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Adaptive RAG</text>
  <polygon points="790,216 840,252 790,288 740,252" fill="#334155" stroke="#64748b"/>
  <text x="790" y="249" text-anchor="middle" font-size="12" fill="#e2e8f0">retrieve</text>
  <text x="790" y="264" text-anchor="middle" font-size="12" fill="#e2e8f0">now?</text>
  <text x="790" y="320" text-anchor="middle" font-size="12.5" fill="#94a3b8">LB · DRAGIN</text>
  <text x="790" y="340" text-anchor="middle" font-size="12.5" fill="#94a3b8">GB · Search-o1</text>
  <text x="790" y="372" text-anchor="middle" font-size="11.5" fill="#64748b">Llama-3.1-8B · QwQ-32B</text>

  <!-- fan-out connectors -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M890,280 C910,280 905,142 930,142"/>
    <path d="M890,280 L930,280"/>
    <path d="M890,280 C910,280 905,418 930,418"/>
  </g>

  <!-- Axis cards -->
  <g>
    <rect x="932" y="78" width="308" height="128" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="952" y="106" font-size="15" font-weight="700" fill="#0f172a">① Answer robustness</text>
    <text x="952" y="146" font-size="30" font-weight="800" fill="#dc2626">63.4% → 50.6%</text>
    <text x="952" y="172" font-size="12.5" fill="#475569">accuracy of QwQ-32B on 2WikiMultiHopQA</text>
    <text x="952" y="190" font-size="12.5" fill="#475569">when the query has spelling errors</text>

    <rect x="932" y="216" width="308" height="128" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="952" y="244" font-size="15" font-weight="700" fill="#0f172a">② Computation robustness</text>
    <text x="952" y="282" font-size="19" font-weight="800" fill="#dc2626">Same question ≠ same cost</text>
    <text x="952" y="310" font-size="12.5" fill="#475569">retrieval-call counts drift across equivalent</text>
    <text x="952" y="328" font-size="12.5" fill="#475569">queries, most under spelling &amp; grammar errors</text>

    <rect x="932" y="354" width="308" height="128" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="952" y="382" font-size="15" font-weight="700" fill="#0f172a">③ Retrieval-decision robustness</text>
    <text x="952" y="422" font-size="30" font-weight="800" fill="#dc2626">up to 55%</text>
    <text x="952" y="448" font-size="12.5" fill="#475569">of retrieval decisions flip under</text>
    <text x="952" y="466" font-size="12.5" fill="#475569">meaning-preserving human rewrites</text>
  </g>
</svg>
